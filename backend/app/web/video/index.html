<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Importar video · AulaVideo</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><main class="shell"><header class="hero"><div><p class="eyebrow">AULAVIDEO</p><h1>Importar video</h1></div><div id="user-bar" class="user-bar"></div></header><nav class="steps" aria-label="Flujo"><a href="/ui/videos/">← Mis videos</a><i></i><span>Ingesta</span><i></i><a href="/ui/resumen/">Resumen</a><i></i><a href="/ui/quiz/">Cuestionario</a><i></i><a href="/ui/material/">Materiales</a></nav><div id="notice" class="notice" role="status">Ingresa una URL pública de YouTube.</div><section class="panel accent-panel"><div class="panel-heading"><p class="number">01</p><h2>Procesar video</h2></div><p class="hint">Videos públicos de YouTube en español o inglés, con duración máxima de 60 minutos.</p><form id="ingest-form" class="stack"><label>URL de YouTube<input id="video-url" type="url" required placeholder="https://www.youtube.com/watch?v=..."></label><button id="ingest-button" type="submit">Iniciar procesamiento →</button></form><div id="progress-card" class="progress-card hidden"><div class="progress-label"><strong id="progress-stage">En cola</strong><span id="progress-value">0%</span></div><div class="progress-track"><div id="progress-bar"></div></div><small id="progress-detail">Esperando al procesamiento local.</small></div></section></main><script type="module" src="/ui/video/page.js"></script></body></html>
