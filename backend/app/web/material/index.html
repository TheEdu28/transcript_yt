<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Material · AulaVideo</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><main class="shell"><header class="hero"><div><p class="eyebrow">AULAVIDEO</p><h1>Editar material</h1><p id="video-label" class="lede"></p></div><div id="user-bar" class="user-bar"></div></header>
<nav class="steps" aria-label="Flujo"><a href="/ui/video/">Ingesta</a><i></i><a id="summary-link" href="/ui/resumen/">Resumen</a><i></i><a id="quiz-link" href="/ui/quiz/">Cuestionario</a><i></i><span>Materiales</span></nav>
<div id="notice" class="notice" role="status"></div>
<p id="last-editor" class="material-last-editor"></p>

<section class="panel">
  <div class="panel-heading"><p class="number">04</p><h2>Cargar material</h2></div>
  <div class="actions two-actions" style="max-width:400px">
    <label style="grid-column:1/3">Material ID<input id="material-id" type="number" min="1" placeholder="17"></label>
    <button id="load-button" type="button" class="secondary">Cargar</button>
    <button id="export-button" type="button" class="secondary">Exportar MD</button>
  </div>
</section>

<!-- Formulario estructurado (solo resumen) -->
<section class="panel" id="summary-editor" style="margin-top:18px;display:none">
  <div class="panel-heading"><p class="number">RESUMEN</p><h2>Editar contenido</h2></div>

  <label>Sinopsis<textarea id="field-synopsis" rows="4" maxlength="1400" placeholder="Resumen en menos de 200 palabras…"></textarea></label>

  <div style="margin-top:20px">
    <div class="editor-section-head">
      <strong>Glosario</strong>
      <button type="button" id="add-glossary" class="secondary" style="padding:4px 10px;font-size:12px">+ Agregar término</button>
    </div>
    <div id="glossary-items" class="editor-list"></div>
  </div>

  <div style="margin-top:20px">
    <div class="editor-section-head">
      <strong>Bloques didácticos</strong>
      <button type="button" id="add-block" class="secondary" style="padding:4px 10px;font-size:12px">+ Agregar bloque</button>
    </div>
    <div id="block-items" class="editor-list"></div>
  </div>

  <div class="actions two-actions" style="margin-top:20px;max-width:400px">
    <button id="save-button" type="button">Guardar edición</button>
    <button id="versions-button" type="button" class="secondary">Ver historial</button>
  </div>
</section>

<!-- Historial de versiones -->
<section class="panel" id="versions-panel" style="margin-top:18px;display:none">
  <div class="panel-heading"><p class="number">HISTORIAL</p><h2>Versiones guardadas</h2></div>
  <div id="versions-list" class="empty-state">Sin versiones anteriores.</div>
</section>
</main><script type="module" src="/ui/material/page.js"></script></body></html>
